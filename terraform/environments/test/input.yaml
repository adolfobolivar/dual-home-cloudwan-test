# terraform/environments/test/input.yaml
# Non-secret config for the `test` environment (architecture.md §5).

environment: "test"
aws_region: "us-east-2"

# VPC CIDRs — non-overlapping /24s, each split into workload + Cloud WAN attachment
# subnets by the network module (architecture.md §2).
old_deploy_vpc_cidr: "10.0.0.0/24"
current_deploy_vpc_cidr: "10.0.1.0/24"
future_deploy_vpc_cidr: "10.0.2.0/24"

# Core network ASNs — private range 64512-65534, one per core network, never shared
# (architecture.md §1-§2, requirements.md NFR-001). Each value is the start of a
# 2-ASN range reserved for that core network (AWS rejects a degenerate single-value
# range) — kept 2 apart so the two ranges never overlap.
core_network_a_asn: 64512
core_network_b_asn: 64514

# Core network segment names — one per core network, never shared. Cloud WAN
# requires alphanumeric-only segment names (no hyphens/underscores).
core_network_a_segment: "SegmentOldCurrent"
core_network_b_segment: "SegmentCurrentFuture"
